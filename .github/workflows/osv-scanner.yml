# Managed by infra/github; edit the shared workflow or its OpenTofu settings.
name: OSV dependency scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: osv-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    uses: m11s-io/.github/.github/workflows/osv-scanner.yml@fd30388e2c4782d08d8a92ae8e48884cf1a280d8 # main
    with:
      upload-sarif: true
